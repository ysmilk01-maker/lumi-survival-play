<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2a1d44">
<title>루미 서바이벌 시험판</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#2a1d44; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none; }
  body { font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; color:#fff; }
  canvas { display:block; position:fixed; inset:0; }
  .ov { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(30,18,52,.72); z-index:10; padding:16px; box-sizing:border-box; text-align:center; }
  .ov.show { display:flex; }
  .panel { background:#3b2a5e; border:3px solid #f0b54a; border-radius:20px; padding:20px 18px; max-width:420px; width:100%; box-sizing:border-box; box-shadow:0 8px 0 #1c1230; }
  h1 { margin:0 0 6px; font-size:26px; } h2 { margin:0 0 10px; font-size:22px; }
  p { margin:6px 0; color:#eadcfb; line-height:1.55; font-size:15px; }
  .btn { display:block; width:100%; margin:12px 0 0; padding:14px; font-size:19px; font-weight:800; border:0; border-radius:16px; color:#fff; background:#e8608c; box-shadow:0 5px 0 #a53a63; font-family:inherit; }
  .btn.sub { background:#6a55a8; box-shadow:0 5px 0 #43337a; font-size:16px; padding:11px; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #a53a63; }
  #hud { position:fixed; left:0; right:0; top:0; z-index:5; padding:calc(env(safe-area-inset-top) + 8px) 12px 0; pointer-events:none; }
  #xpbar { height:12px; background:#1c1230cc; border-radius:8px; overflow:hidden; border:2px solid #f0b54a; }
  #xpfill { height:100%; width:0; background:linear-gradient(90deg,#7ad7ff,#b893ff); }
  #row { display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-weight:800; text-shadow:0 2px 0 #1c1230; }
  #timer { font-size:24px; } #lv, #kills { font-size:15px; min-width:80px; }
  #kills { text-align:right; }
  #slots { display:flex; gap:4px; margin-top:6px; }
  #slots div { width:34px; height:34px; border-radius:9px; background:#1c1230aa; border:2px solid #f0b54a88; position:relative; }
  #slots img { width:100%; height:100%; object-fit:contain; }
  #slots span { position:absolute; right:-2px; bottom:-4px; font-size:11px; font-weight:800; background:#e8608c; border-radius:6px; padding:0 3px; }
  #pause { position:fixed; right:12px; top:calc(env(safe-area-inset-top) + 76px); z-index:6; width:44px; height:44px; border-radius:12px; border:2px solid #f0b54a; background:#3b2a5ecc; color:#fff; font-size:18px; font-weight:900; }
  #ver { position:fixed; left:8px; bottom:calc(env(safe-area-inset-bottom) + 6px); z-index:5; font-size:11px; color:#ffffffaa; pointer-events:none; }
  #toast { position:fixed; left:50%; top:30%; transform:translate(-50%,-50%); z-index:7; font-size:24px; font-weight:900; color:#fff; text-shadow:0 3px 0 #a53a63, 0 0 12px #000; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; }
  #cards .wrap { display:flex; flex-direction:column; gap:10px; max-width:420px; width:100%; }
  .card { display:flex; gap:12px; align-items:center; text-align:left; background:#fff8ee; color:#4a2e5c; border-radius:16px; padding:10px 12px; border:3px solid #f0b54a; box-shadow:0 5px 0 #a8752a; }
  .card:active { transform:translateY(3px); box-shadow:0 2px 0 #a8752a; }
  .card .ic { width:64px; height:64px; flex:none; position:relative; }
  .card .ic img { width:100%; height:100%; object-fit:contain; }
  .card .ic img.b { position:absolute; width:58%; height:58%; right:-6px; bottom:-6px; }
  .card b { font-size:18px; } .card .lv { font-size:13px; color:#e8608c; font-weight:800; margin-left:6px; }
  .card .d { font-size:14px; margin-top:2px; line-height:1.4; }
  .card .t { display:inline-block; font-size:12px; font-weight:800; border-radius:8px; padding:1px 7px; margin-top:4px; margin-right:4px; }
  .t.g { background:#d7f5df; color:#2e9e4f; } .t.au { background:#ffeec2; color:#a46a00; } .t.n { background:#e9e0ff; color:#6a55a8; }
  .card.fusion { background:#fff3c6; border-color:#ff9f1c; }
  .how { text-align:left; background:#2a1d44; border-radius:12px; padding:10px 12px; margin-top:10px; font-size:14px; line-height:1.6; color:#eadcfb; }
  .how b { color:#ffd166; }
  #load { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:20; background:#2a1d44; font-size:18px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="xpbar"><div id="xpfill"></div></div>
  <div id="row"><div id="lv">Lv 1</div><div id="timer">0:00</div><div id="kills">처치 0</div></div>
  <div id="slots"></div>
</div>
<button id="pause">II</button>
<div id="ver">시험판 1차</div>
<div id="toast"></div>
<div id="load">마법책을 펴는 중…</div>

<div class="ov" id="start"><div class="panel">
  <img src="img/lumi-idle.png" alt="" style="height:130px">
  <h1>루미 서바이벌</h1>
  <p>몰려오는 몬스터 떼 속에서 <b>5분</b>을 버티세요!</p>
  <div class="how">
    <b>움직이기</b> — 화면 아무 데나 누르고 끌어요(PC는 방향키 · WASD)<br>
    <b>공격</b> — 마법이 알아서 쏴요<br>
    <b>별사탕</b>을 주우면 레벨업 → <b>카드 셋 중 하나</b><br>
    <span style="color:#7be29a"><b>상성</b></span> — 같이 가진 마법끼리 더 세져요<br>
    <span style="color:#ffd166"><b>합체</b></span> — 짝이 맞는 두 마법을 <b>Lv5</b>로 키운 뒤 상자를 열면!
  </div>
  <button class="btn" id="go">시작!</button>
</div></div>

<div class="ov" id="cards"><h2 id="cardTitle">레벨업! 하나를 골라요</h2><div class="wrap" id="cardWrap"></div></div>

<div class="ov" id="revive"><div class="panel">
  <h2>쓰러졌어요…</h2>
  <p>한 판에 한 번, 이어서 할 수 있어요.</p>
  <button class="btn" id="revYes">광고 보고 이어하기</button>
  <p style="font-size:12px">(시험판은 광고 없이 바로 이어져요)</p>
  <button class="btn sub" id="revNo">그만하기</button>
</div></div>

<div class="ov" id="result"><div class="panel">
  <img id="resImg" src="img/lumi-cast.png" alt="" style="height:110px">
  <h2 id="resTitle">결과</h2>
  <p id="resBody"></p>
  <button class="btn" id="again">다시 하기</button>
</div></div>

<div class="ov" id="paused"><div class="panel">
  <h2>잠깐 멈춤</h2>
  <p id="pauseInfo"></p>
  <button class="btn" id="resume">계속하기</button>
  <button class="btn sub" id="quit">처음부터</button>
</div></div>

<script>
'use strict';
// 루미 서바이벌 손맛 시험판 1차 — 루미의 마법 디펜스 그림을 줄여 쓴 HTML5 판(유니티 판 전에 재미 확인용)
const VERSION = '시험판 1차';
const IMGS = ['lumi-idle','lumi-cast','e-jelly','e-mush','e-turtle','e-bat','e-slime','b-kingjelly','b-pumpkin','s-fire-1','s-ice-1','s-bolt-1','s-thorn-1','s-light-1','s-poison-1','p-fire','p-poison','fx-iceball','fx-puddle','i-candy','i-power','i-haste','i-boon-range','i-heal','c-firestorm','fx-tornado','sp1','fxRing','fx-poof-1','fxBoomS','fx-star','box-closed'];
const IMG = {};
const $ = id => document.getElementById(id);
const cv = $('c'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, ZOOM = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ZOOM = Math.max(0.8, Math.min(1.35, Math.min(W, H) / 400));
}
addEventListener('resize', resize); resize();

// ───────── 마법 정의
const SP = {
  fire:   { name:'불꽃', img:'s-fire-1', d:['가까운 적에게 불덩이 — 맞은 자리가 터져요','불덩이가 더 세져요','불덩이 2개','터지는 범위 넓게','불덩이 3개'] },
  ice:    { name:'얼음 수정', img:'s-ice-1', d:['둘레로 냉기 파동 — 적이 느려져요','파동이 더 세져요','파동 범위 넓게','더 자주','잠깐 얼려요'] },
  bolt:   { name:'번개 구름', img:'s-bolt-1', d:['가까운 적에게 사슬 번개','튀는 횟수 +1','번개가 더 세져요','더 자주','튀는 횟수 2배'] },
  thorn:  { name:'가시 덩굴', img:'s-thorn-1', d:['루미 둘레를 도는 가시','가시 +1','가시가 더 세져요','가시 +1','가시 고리 두 겹'] },
  light:  { name:'빛 프리즘', img:'s-light-1', d:['가장 튼튼한 적에게 빛줄기 — 꿰뚫어요','빛줄기가 더 세져요','빛줄기 굵게','더 자주','빛줄기 셋'] },
  poison: { name:'독 솥', img:'s-poison-1', d:['발밑에 독 웅덩이','웅덩이가 더 세져요','웅덩이 넓게','더 오래','더 자주'] },
};
const FUS = {
  storm:   { name:'얼음 번개 폭풍', a:'ice', b:'bolt', img:'s-ice-1', img2:'s-bolt-1', d:'둘레 적에게 번개가 쏟아지고 얼어붙어요' },
  garden:  { name:'독가시 정원', a:'poison', b:'thorn', img:'s-poison-1', img2:'s-thorn-1', d:'독을 묻힌 큰 가시 고리 + 걷는 자리마다 독' },
  inferno: { name:'불타는 독 늪', a:'fire', b:'poison', img:'s-fire-1', img2:'s-poison-1', d:'불덩이가 터진 자리에 불타는 늪' },
};
const SYN = [
  { a:'ice', b:'bolt', t:'느려진 적에게 번개 2배' },
  { a:'fire', b:'poison', t:'독 걸린 적에게 불꽃 1.5배' },
  { a:'thorn', b:'poison', t:'가시에 맞으면 독' },
  { a:'light', b:'ice', t:'빛 프리즘 1.3배' },
];
const BOONS = {
  power: { name:'마력 올리기', img:'i-power', d:'모든 마법 공격력 +12%' },
  haste: { name:'빠른 발', img:'i-haste', d:'이동 속도 +10%' },
  range: { name:'넓은 손', img:'i-boon-range', d:'별사탕 줍는 범위 +35%' },
  heal:  { name:'튼튼한 루미', img:'i-heal', d:'최대 체력 +20, 체력 모두 회복' },
};
const MAXSP = 4;

// ───────── 상태
let P, enemies, projs, fxs, gems, puddles, texts, bolts, beams, chests;
let T, running, paused, kills, spawnAcc, elite1, elite2, midDone, bossDone, bossRef, shake, won, cardQueue;
const joy = { on:false, ox:0, oy:0, x:0, y:0, id:null };
const keys = {};

function reset() {
  P = { x:0, y:0, hp:100, max:100, spd:150, inv:0, lv:1, xp:0, next:6, magnet:80, dmg:1, face:1, castT:0, revived:false, sp:{}, fus:{}, ang:0, hitT:0, t:{} };
  P.sp.fire = 1;
  enemies = []; projs = []; fxs = []; gems = []; puddles = []; texts = []; bolts = []; beams = []; chests = [];
  T = 0; kills = 0; spawnAcc = 0; elite1 = elite2 = midDone = bossDone = false; bossRef = null; shake = 0; won = false; cardQueue = 0;
  running = true; paused = false;
  refreshSlots();
}

// ───────── 격자(가까운 적 빨리 찾기)
const CELL = 80; let grid = new Map();
function buildGrid() {
  grid.clear();
  for (const e of enemies) { const k = ((e.x / CELL) | 0) + ',' + ((e.y / CELL) | 0); let a = grid.get(k); if (!a) grid.set(k, a = []); a.push(e); }
}
function near(x, y, r, out) {
  out.length = 0;
  const x0 = Math.floor((x - r) / CELL), x1 = Math.floor((x + r) / CELL), y0 = Math.floor((y - r) / CELL), y1 = Math.floor((y + r) / CELL);
  for (let i = x0; i <= x1; i++) for (let j = y0; j <= y1; j++) {
    const a = grid.get(i + ',' + j); if (!a) continue;
    for (const e of a) { if (e.dead) continue; const dx = e.x - x, dy = e.y - y, rr = r + e.r; if (dx * dx + dy * dy <= rr * rr) out.push(e); }
  }
  return out;
}
const tmp = [], tmp2 = [];
function nearest(x, y, r, skip) {
  let best = null, bd = r * r;
  for (const e of near(x, y, r, tmp)) { if (skip && skip.has(e)) continue; const d = (e.x - x) ** 2 + (e.y - y) ** 2; if (d < bd) { bd = d; best = e; } }
  return best;
}

// ───────── 몬스터
const ET = {
  jelly:  { img:'e-jelly', hp:14, spd:58, size:40, xp:1 },
  mush:   { img:'e-mush', hp:10, spd:98, size:38, xp:1 },
  bat:    { img:'e-bat', hp:9, spd:118, size:42, xp:1, fly:true },
  turtle: { img:'e-turtle', hp:60, spd:40, size:52, xp:3 },
  slime:  { img:'e-slime', hp:26, spd:62, size:46, xp:2, split:true },
};
function hpScale() { return 1 + T / 60 * 0.7 + Math.max(0, T - 180) / 60 * 0.6; }
function spawn(type, opt = {}) {
  const d = ET[type] || opt.def;
  const a = opt.ang ?? Math.random() * Math.PI * 2;
  const dist = opt.dist ?? (Math.hypot(W, H) / ZOOM) * 0.55 + 40;
  const e = { type, img: opt.img || d.img, x: opt.x ?? P.x + Math.cos(a) * dist, y: opt.y ?? P.y + Math.sin(a) * dist,
    spd: (opt.spd || d.spd) * (0.9 + Math.random() * 0.2), size: opt.size || d.size, xp: opt.xp || d.xp, fly: d.fly, split: d.split,
    elite: !!opt.elite, boss: !!opt.boss, leader: !!opt.leader, slowT: 0, slowK: 1, frz: 0, psnT: 0, psnDps: 0, hitT: 0, cd: {}, ph: Math.random() * 9, dead: false, sk: 0 };
  e.max = e.hp = (opt.hp || d.hp) * (opt.boss ? 1 : hpScale()) * (opt.elite ? 3.5 : 1);
  e.r = e.size * 0.38;
  enemies.push(e); return e;
}
function hurt(e, dmg, kind) {
  if (e.dead) return;
  if (kind === 'bolt' && P.sp.ice && (e.slowT > 0 || e.frz > 0)) dmg *= 2;
  if (kind === 'fire' && P.sp.poison && e.psnT > 0) dmg *= 1.5;
  if (kind === 'light' && P.sp.ice) dmg *= 1.3;
  dmg *= P.dmg;
  const crit = Math.random() < 0.06; if (crit) dmg *= 2;
  e.hp -= dmg; e.hitT = 0.12;
  if (texts.length < 50 && (crit || Math.random() < 0.35 || e.boss)) texts.push({ x: e.x + (Math.random() - .5) * 14, y: e.y - e.size * 0.6, v: Math.round(dmg), t: 0, c: crit });
  if (e.hp <= 0) kill(e);
}
function kill(e) {
  e.dead = true; kills++;
  addFx('fx-poof-1', e.x, e.y - e.size * 0.3, e.size * 0.6, e.size * 1.3, 0.35, 1);
  for (let i = 0; i < (e.boss ? 18 : 3); i++) sparkle(e.x, e.y - e.size * 0.3, e.boss ? 260 : 120);
  const n = e.boss ? 25 : e.elite ? 6 : 1;
  for (let i = 0; i < n; i++) gems.push({ x: e.x + (Math.random() - .5) * (n > 1 ? 60 : 0), y: e.y + (Math.random() - .5) * (n > 1 ? 60 : 0), v: e.boss ? 4 : e.elite ? 2 : e.xp, t: 0, pull: false });
  if (e.split) for (let k = 0; k < 2; k++) spawn('jelly', { x: e.x + (k ? 14 : -14), y: e.y, size: 30, hp: 8 });
  if (e.leader || (e.boss && e !== bossRef) ) chests.push({ x: e.x, y: e.y, t: 0 });
  if (e === bossRef) {
    if (bossDone) { win(); }
    else { chests.push({ x: e.x, y: e.y, t: 0 }); bossRef = null; toast('중간 보스 처치!'); shake = 0.5; }
  }
}

// ───────── 효과
function addFx(img, x, y, s0, s1, dur, a0, rot) { if (fxs.length > 160) return; fxs.push({ img, x, y, s0, s1, dur, t: 0, a0: a0 ?? 1, rot: rot ?? Math.random() * 6 }); }
function sparkle(x, y, sp) { if (fxs.length > 160) return; const a = Math.random() * 6.283; fxs.push({ img: 'sp1', x, y, vx: Math.cos(a) * sp * Math.random(), vy: Math.sin(a) * sp * Math.random() - 60, s0: 22, s1: 4, dur: 0.5, t: 0, a0: 1, rot: 0 }); }
let toastT = 0;
function toast(s) { const el = $('toast'); el.textContent = s; el.style.opacity = 1; toastT = 1.8; }

// ───────── 마법 실행
function lvOf(id) { return P.sp[id] || 0; }
function cd(id, base) { P.t[id] = (P.t[id] ?? 0.3) - DT; if (P.t[id] > 0) return false; P.t[id] = base; return true; }
let DT = 0;
function castSpells() {
  const L = P.sp, F = P.fus;
  // 불꽃 / 불타는 독 늪
  if (L.fire || F.inferno) {
    const lv = F.inferno ? 5 : L.fire, n = F.inferno ? 3 : [0,1,1,2,2,3][lv];
    if (cd('fire', F.inferno ? 0.6 : [0,1.1,1.0,0.95,0.85,0.75][lv])) {
      const skip = new Set();
      for (let i = 0; i < n; i++) {
        const tgt = nearest(P.x, P.y, 420, skip) || nearest(P.x, P.y, 420); if (!tgt) break; skip.add(tgt);
        projs.push({ kind: 'fire', img: 'p-fire', x: P.x, y: P.y - 20, tx: tgt, sp: 420, dmg: (F.inferno ? 50 : 14 + lv * 7), r: (F.inferno ? 70 : 38 + lv * 6), size: 34, inferno: !!F.inferno });
      }
      P.castT = 0.25;
    }
  }
  // 얼음 수정 / 폭풍
  if (L.ice || F.storm) {
    const lv = F.storm ? 5 : L.ice;
    if (cd('ice', F.storm ? 1.5 : [0,2.4,2.3,2.2,1.8,1.6][lv])) {
      const R = F.storm ? 190 : [0,95,105,130,135,145][lv];
      addFx('fxRing', P.x, P.y, 20, R * 2.2, 0.4, 0.9);
      for (const e of near(P.x, P.y, R, tmp2)) { hurt(e, F.storm ? 30 : 6 + lv * 4, 'ice'); e.slowT = 2; e.slowK = 0.5; if (lv >= 5) e.frz = F.storm ? 1.2 : 0.6; }
    }
  }
  // 번개 구름 / 폭풍
  if (L.bolt || F.storm) {
    const lv = F.storm ? 5 : L.bolt;
    if (F.storm) {
      if (cd('storm', 0.45)) for (let k = 0; k < 3; k++) {
        const pool = near(P.x, P.y, 320, tmp2); if (!pool.length) break;
        const e = pool[(Math.random() * pool.length) | 0];
        bolts.push({ pts: [[e.x, e.y - 260], [e.x + (Math.random() - .5) * 30, e.y - 130], [e.x, e.y - e.size * 0.4]], t: 0 });
        hurt(e, 45, 'bolt'); e.frz = Math.max(e.frz, 0.8);
        addFx('fxBoomS', e.x, e.y - e.size * 0.4, 20, 70, 0.25, 0.9);
      }
    } else if (cd('bolt', [0,1.4,1.35,1.25,1.0,0.9][lv])) {
      let jumps = [0,2,3,3,4,8][lv], from = { x: P.x, y: P.y - 30 }, skip = new Set(), pts = [[from.x, from.y]];

// ───────── 갱신

  cx.translate(W / 2 + sx, H / 2 + sy); cx.scale(ZOOM, ZOOM); cx.translate(-P.x, -P.y);
  if (!grass) makeGrass();
  cx.fillStyle = grass; const vw = W / ZOOM, vh = H / ZOOM; cx.fillRect(P.x - vw / 2 - 10, P.y - vh / 2 - 10, vw + 20, vh + 20);
  // 웅덩이
  for (const u of puddles) { const a = Math.min(1, u.t * 4) * Math.min(1, (u.life - u.t) * 2); cx.globalAlpha = 0.75 * a; drawImg('fx-puddle', u.x, u.y, u.r * 2.2, u.r * 1.7); if (u.burn) { cx.globalAlpha = 0.5 * a; cx.fillStyle = '#ff8a3d'; cx.beginPath(); cx.ellipse(u.x, u.y, u.r * 0.8, u.r * 0.55, 0, 0, 6.29); cx.fill(); } }
  cx.globalAlpha = 1;
  // 별사탕 · 상자
  for (const g of gems) drawImg('i-candy', g.x, g.y + Math.sin(T * 6 + g.x) * 2, 18 + g.v * 3, 18 + g.v * 3);
  for (const c of chests) { drawImg('fxRing', c.x, c.y + 8, 70 + Math.sin(T * 5) * 8, 30); const [w, h] = sized('box-closed', 56); drawImg('box-closed', c.x, c.y - 18 - Math.abs(Math.sin(T * 4)) * 8, w, h); }
  // 그림자 + 몬스터 · 루미 (y 순서)
  const list = enemies.slice(); list.push(P); list.sort((a, b) => a.y - b.y);
  for (const e of list) {
    if (e === P) { drawLumi(); continue; }
    const sz = e.size * (1 + e.hitT * 1.6);
    cx.fillStyle = 'rgba(40,20,60,.22)'; cx.beginPath(); cx.ellipse(e.x, e.y + 2, e.size * 0.38, e.size * 0.14, 0, 0, 6.29); cx.fill();
    if (e.elite || e.boss) { cx.globalAlpha = 0.6; drawImg('fxRing', e.x, e.y + 2, e.size * 1.3, e.size * 0.5); cx.globalAlpha = 1; }
    if (e.slowT > 0 || e.frz > 0) { cx.fillStyle = e.frz > 0 ? 'rgba(160,220,255,.55)' : 'rgba(160,220,255,.3)'; cx.beginPath(); cx.ellipse(e.x, e.y, e.size * 0.42, e.size * 0.18, 0, 0, 6.29); cx.fill(); }
    const hop = e.fly ? -18 + Math.sin(e.ph) * 4 : -Math.abs(Math.sin(e.ph)) * e.size * 0.08;
    const [w, h] = sized(e.img, sz);
    drawImg(e.img, e.x, e.y - h / 2 + hop, w * (1 + Math.cos(e.ph * 2) * 0.04), h * (1 - Math.cos(e.ph * 2) * 0.04), P.x < e.x);
    if (e.hitT > 0) { cx.globalAlpha = e.hitT * 4; cx.globalCompositeOperation = 'lighter'; drawImg(e.img, e.x, e.y - h / 2 + hop, w, h, P.x < e.x); cx.globalCompositeOperation = 'source-over'; cx.globalAlpha = 1; }
    if (e.psnT > 0) { cx.fillStyle = '#7be25a'; cx.beginPath(); cx.arc(e.x + e.size * 0.3, e.y - h + hop, 4, 0, 6.29); cx.fill(); }
    if (e.boss || e.elite) { const bw = e.boss ? 90 : 40; cx.fillStyle = '#1c1230aa'; cx.fillRect(e.x - bw / 2, e.y - h - 14 + hop, bw, 6); cx.fillStyle = e.boss ? '#ff5c7a' : '#ffb84d'; cx.fillRect(e.x - bw / 2, e.y - h - 14 + hop, bw * Math.max(0, e.hp / e.max), 6); }
  }
  // 가시 고리
  drawThorns();
  // 탄
  for (const p of projs) { cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot || 0); drawImg(p.img, 0, 0, p.size, p.size); cx.restore(); }
  // 빛줄기 · 번개
  cx.globalCompositeOperation = 'lighter';
  for (const b of beams) { const a = 1 - b.t / 0.22; cx.strokeStyle = `rgba(255,250,200,${a})`; cx.lineWidth = b.w * (1.2 - b.t * 2); cx.lineCap = 'round'; cx.beginPath(); cx.moveTo(b.x0, b.y0); cx.lineTo(b.x1, b.y1); cx.stroke(); cx.strokeStyle = `rgba(255,255,255,${a})`; cx.lineWidth = b.w * 0.35; cx.stroke(); }
  for (const b of bolts) {
    const a = 1 - b.t / 0.18; cx.strokeStyle = `rgba(255,240,120,${a})`; cx.lineWidth = 5; cx.beginPath();
    for (let i = 0; i < b.pts.length; i++) { const [x, y] = b.pts[i]; if (!i) cx.moveTo(x, y); else { const [px, py] = b.pts[i - 1]; cx.lineTo((px + x) / 2 + (Math.random() - .5) * 18, (py + y) / 2 + (Math.random() - .5) * 18); cx.lineTo(x, y); } }
    cx.stroke(); cx.strokeStyle = `rgba(255,255,255,${a})`; cx.lineWidth = 2; cx.stroke();
  }
  // 효과
  for (const f of fxs) { const k = f.t / f.dur, s = f.s0 + (f.s1 - f.s0) * (1 - (1 - k) * (1 - k)); cx.globalAlpha = f.a0 * (1 - k); cx.save(); cx.translate(f.x, f.y); cx.rotate(f.rot); drawImg(f.img, 0, 0, s, f.img === 'fxRing' ? s * 0.6 : s); cx.restore(); }
  cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over';
  // 피해 숫자
  cx.textAlign = 'center'; cx.font = '800 15px "Malgun Gothic", sans-serif';
  for (const t of texts) { cx.globalAlpha = 1 - t.t / 0.7; cx.fillStyle = t.c ? '#ffd23f' : '#fff'; cx.strokeStyle = '#4a2e5c'; cx.lineWidth = 3; const y = t.y - t.t * 40; cx.font = t.c ? '900 20px "Malgun Gothic", sans-serif' : '800 14px "Malgun Gothic", sans-serif'; cx.strokeText(t.v, t.x, y); cx.fillText(t.v, t.x, y); }
  cx.globalAlpha = 1;
  cx.restore();
  // 화면 가장자리 위험
  if (P.hp < P.max * 0.3 && running) { const g = cx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.7); g.addColorStop(0, 'rgba(255,40,80,0)'); g.addColorStop(1, `rgba(255,40,80,${0.25 + 0.15 * Math.sin(T * 6)})`); cx.fillStyle = g; cx.fillRect(0, 0, W, H); }
  // 조이스틱
  if (joy.on) {
    cx.globalAlpha = 0.35; cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(joy.ox, joy.oy, 50, 0, 6.29); cx.fill();
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy), k = d > 50 ? 50 / d : 1;
    cx.globalAlpha = 0.75; cx.fillStyle = '#ffd166'; cx.beginPath(); cx.arc(joy.ox + dx * k, joy.oy + dy * k, 22, 0, 6.29); cx.fill(); cx.globalAlpha = 1;
  }
  // HUD
  $('xpfill').style.width = (P.xp / P.next * 100).toFixed(1) + '%';
  $('lv').textContent = 'Lv ' + P.lv; $('timer').textContent = fmt(Math.min(T, 300)) + (T < 300 ? ' / 5:00' : ''); $('kills').textContent = '처치 ' + kills;
}
function drawLumi() {
  const key = P.castT > 0 ? 'lumi-cast' : 'lumi-idle';
  const [w, h] = sized(key, 74);
  cx.fillStyle = 'rgba(40,20,60,.25)'; cx.beginPath(); cx.ellipse(P.x, P.y + 2, 20, 7, 0, 0, 6.29); cx.fill();
  const bob = P.moving ? -Math.abs(Math.sin(T * 12)) * 5 : Math.sin(T * 2.2) * 1.5;
  if (P.inv > 0 && Math.floor(T * 20) % 2) cx.globalAlpha = 0.5;
  drawImg(key, P.x, P.y - h / 2 + bob, w * (P.moving ? 1 : 1 - Math.sin(T * 2.2) * 0.02), h * (P.moving ? 1 : 1 + Math.sin(T * 2.2) * 0.02), P.face < 0);
  if (P.hitT > 0) { cx.globalAlpha = P.hitT * 2; cx.globalCompositeOperation = 'lighter'; drawImg(key, P.x, P.y - h / 2 + bob, w, h, P.face < 0); cx.globalCompositeOperation = 'source-over'; }
  cx.globalAlpha = 1;
  // 체력 막대
  cx.fillStyle = '#1c1230aa'; cx.fillRect(P.x - 24, P.y + 8, 48, 6); cx.fillStyle = P.hp < P.max * 0.3 ? '#ff5c7a' : '#7be29a'; cx.fillRect(P.x - 24, P.y + 8, 48 * Math.max(0, P.hp / P.max), 6);
}
function drawThorns() {
  const F = P.fus, lv = F.garden ? 5 : P.sp.thorn; if (!lv) return;
  const rings = F.garden ? [[6, 95, 2.6], [8, 150, -1.9]] : lv >= 5 ? [[4, 80, 3], [4, 125, -2.4]] : [[[0,1,2,2,3][lv], 80, 3]];
  for (const [n, R, w] of rings) for (let i = 0; i < n; i++) {
    const a = T * w + i / n * Math.PI * 2, x = P.x + Math.cos(a) * R, y = P.y + Math.sin(a) * R * 0.85 - 16;
    cx.save(); cx.translate(x, y); cx.rotate(a + 1.57); drawImg('s-thorn-1', 0, 0, F.garden ? 46 : 36, F.garden ? 46 : 36); if (F.garden) { cx.globalAlpha = 0.5; drawImg('p-poison', 0, 0, 26, 26); cx.globalAlpha = 1; } cx.restore();
  }
}

// ───────── 돌리기
let last = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  if (running && !paused && P) update(dt);
  if (P) render();
  requestAnimationFrame(loop);
}
Promise.all(IMGS.map(k => new Promise(res => { const im = new Image(); im.onload = () => { IMG[k] = im; res(); }; im.onerror = res; im.src = 'img/' + k + '.png'; })))
  .then(() => { $('load').style.display = 'none'; reset(); running = false; $('start').classList.add('show'); requestAnimationFrame(loop); });
$('ver').textContent = VERSION;
</script>
