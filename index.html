<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>루미 서바이벌 시험판</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin:0; height:100%; }
  body { display:flex; align-items:center; justify-content:center; background:#2a1d44; color:#fff6fb;
         font:16px/1.6 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; text-align:center; padding:0 16px; }
  .card { max-width:420px; background:#3b2a5e; border:3px solid #f0b54a; border-radius:20px; padding:28px 22px; }
  h1 { font-size:24px; margin:0 0 8px; }
  p { margin:6px 0; color:#e9d8fa; }
  .tag { display:inline-block; background:#ffd166; color:#4a2e5c; font-weight:700; border-radius:99px; padding:2px 12px; font-size:14px; margin-bottom:10px; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">준비 중</div>
    <h1>루미 서바이벌 (가칭)</h1>
    <p>첫 시험판을 만드는 중이에요.</p>
    <p>시험판이 올라오면 이 주소에서 바로 해 볼 수 있어요.</p>
  </div>
</body>
</html>
