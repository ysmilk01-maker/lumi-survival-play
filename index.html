#loading .tip{min-height:46px;margin-top:16px;font-size:14px;line-height:1.65;color:#c9b8e6;text-shadow:0 2px 6px #07061a;transition:opacity .45s,transform .45s}#loading .tip.out{opacity:0;transform:translateY(6px)}

@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.1) translate(-1.5%,-2%)}}@keyframes shine{to{background-position:-220% 0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinr{to{transform:rotate(-360deg)}}@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}@keyframes sweep{from{background-position:150% 0}to{background-position:-50% 0}}@keyframes twk{to{transform:scale(1.25) rotate(20deg)}}@keyframes rise{from{opacity:0;transform:translateY(18px)}}@keyframes flash{0%{opacity:0}25%{opacity:.95}100%{opacity:0}}@keyframes outfade{0%,30%{opacity:1}100%{opacity:0;visibility:hidden}}button{font:22px Jua;border:0;border-radius:20px;padding:16px 32px;background:#248B86;color:#fff6e8;margin-top:22px}#failure{display:none}footer{position:absolute;bottom:20px;color:#b5a6c4;font-size:12px}@keyframes bob{50%{transform:translateY(-12px) rotate(1.5deg)}}@media(max-aspect-ratio:3/4){#frame{width:100vw}}@media(prefers-reduced-motion:reduce){#hero,#loading .bg,#loading .halo,#loading .ring svg,#loading .ring .in,#loading h1 span,#loading h1 b,#fill::before,#spark,#loading .glow{animation:none}}

<main id="frame"><canvas id="unity-canvas" tabindex="0" aria-label="별빛 마법사 루미 게임"></canvas>
<section id="loading" aria-live="polite"><div class="bg"></div><div class="shade"></div><canvas id="fx" aria-hidden="true"></canvas><div class="top"><div class="eyebrow"><i></i>STARLIGHT WITCH<i></i></div><h1><span>별빛 마법사</span><b>루미</b></h1><div class="tag">선택하고, 돌파하고, 생존하라</div></div><div class="stage"><div class="halo"></div><div class="glow"></div><div class="ring"><svg viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="#ffe3a0"><circle cx="100" cy="100" r="96" stroke-width="1.6"/><circle cx="100" cy="100" r="90" stroke-width="5" stroke-dasharray="1.2 4.6" opacity=".8"/><circle cx="100" cy="100" r="82" stroke-width="1"/><circle cx="100" cy="100" r="62" stroke-width="1.2" stroke="#9fe8de"/><g class="in"><polygon points="100,22 167.5,139 32.5,139" stroke-width="1.4"/><polygon points="100,178 167.5,61 32.5,61" stroke-width="1.4"/><circle cx="100" cy="100" r="40" stroke-width="1" stroke-dasharray="6 3" stroke="#9fe8de"/></g></g><g fill="#fff3cf"><circle cx="100" cy="4" r="3.4"/><circle cx="196" cy="100" r="3.4"/><circle cx="100" cy="196" r="3.4"/><circle cx="4" cy="100" r="3.4"/><circle cx="168" cy="32" r="2.2"/><circle cx="168" cy="168" r="2.2"/><circle cx="32" cy="168" r="2.2"/><circle cx="32" cy="32" r="2.2"/></g></svg></div><img id="hero" src="TemplateData/lumi.png" alt="견습 마법사 루미"></div><div class="bottom"><div class="row"><span id="message">마법책을 펴는 중</span><span id="pct">0%</span></div><div class="track"><div id="fill"></div><div id="spark"></div></div><div class="tip" id="tip">몬스터 떼를 한가운데로 모아<br>마법으로 한 번에 쓸어버리세요!</div></div><footer>시험판 114차 · 첫 실행은 조금 더 걸릴 수 있어요</footer></section>
<section id="failure" role="alert"><h1>잠시 길을 잃었어요</h1><p class="message">게임을 불러오지 못했어요.<br>인터넷 연결을 확인한 뒤 다시 열어 주세요.</p><button onclick="location.reload()">다시 불러오기</button></section></main>
<script>
const VERSION='시험판 114차';
// 17차 진단: 하얀 화면(페이지가 내려감) 직전 상태를 기기에 남긴다. 주소에 ?debug=1 이면 화면 왼쪽 위에 실시간 표시.
function lumiDiag(game){
 let prev=null;try{prev=JSON.parse(localStorage.getItem('lumiDiag')||'null');}catch(e){}
 const box=document.createElement('div');box.style.cssText='position:fixed;left:6px;top:6px;z-index:99;font:12px/1.4 monospace;color:#fff;background:#000a;padding:4px 6px;border-radius:6px;pointer-events:none;white-space:pre';
 const debug=/debug/.test(location.search);
 let err='';try{err=localStorage.getItem('lumiErr')||'';}catch(e){}
 if(prev&&!prev.clean){box.textContent='직전 판이 비정상 종료됨\n'+prev.text+(err?'\n오류 '+err:'')+'\n(이 화면을 캡처해 보내 주세요)';document.body.appendChild(box);setTimeout(()=>{if(!debug)box.remove();},12000);}
 else if(debug)document.body.appendChild(box);
 const t0=Date.now();let frames=0,fpsT0=performance.now();(function tick(){frames++;requestAnimationFrame(tick);})();
 function save(clean){try{const m=game.GetMetricsInfo?game.GetMetricsInfo():{};const sec=Math.round((Date.now()-t0)/1000);
  const now=performance.now(),fps=Math.round(frames*1000/Math.max(1,now-fpsT0));frames=0;fpsT0=now;
  const text=VERSION.replace('시험판 ','')+' '+Math.floor(sec/60)+'분'+(sec%60)+'초 · '+(document.hidden?'다른 앱으로 나감':'화면 보는 중')+' · WASM '+Math.round((m.totalWASMHeapSize||0)/1048576)+'MB(사용 '+Math.round((m.usedWASMHeapSize||0)/1048576)+') · '+fps+'fps · 화면 '+canvas.width+'x'+canvas.height;
  localStorage.setItem('lumiDiag',JSON.stringify({clean:clean,text:text}));if(debug&&box.isConnected)box.textContent=text;}catch(e){}}
 // 21차: Unity fps 값은 늘 0이라 직접 센다. 다른 앱으로 나가 있는 동안은 정상 종료로 기록한다
 // (아이폰이 뒤에 둔 탭을 메모리 때문에 내리면 돌아올 때 새로 열리는데, 21차까지는 이것도 비정상 종료로 보였다)
 save(document.hidden);setInterval(()=>save(document.hidden),2000);
 window.addEventListener('pagehide',()=>save(true));document.addEventListener('visibilitychange',()=>save(document.hidden));
}

const canvas=document.getElementById('unity-canvas');
// 71차: 로딩 화면 연출
const LOAD=document.getElementById('loading');
const TIPS=['몬스터 떼를 한가운데로 모아<br>마법으로 한 번에 쓸어버리세요!','두 마법을 끝까지 키우면<br>바로 <b style="color:#ffe7a6;font-weight:400">합체 마법</b>이 돼요','보스의 <b style="color:#9fe8de;font-weight:400">약점 속성</b>은<br>출격 전에 정찰 보고에서 확인하세요','위험한 장판이 깔리면<br>회피 단추로 재빨리 빠져나가요','레전드 카드가 뜨면<br>마법이 단숨에 두 단계 올라요'];
const STEPS=[[0,'마법책을 펴는 중'],[.2,'별빛을 모으는 중'],[.45,'마법진을 그리는 중'],[.7,'몬스터 떼가 다가오는 중'],[.9,'출격 준비 완료 직전']];
let tipI=0;const tipEl=document.getElementById('tip');const tipT=setInterval(()=>{tipEl.classList.add('out');setTimeout(()=>{tipI=(tipI+1)%TIPS.length;tipEl.innerHTML=TIPS[tipI];tipEl.classList.remove('out');},450);},3800);
function loadProgress(p){p=Math.max(0,Math.min(1,p));const w=(p*100)+'%';document.getElementById('fill').style.width=w;document.getElementById('spark').style.left=w;document.getElementById('pct').textContent=Math.round(p*100)+'%';let m=STEPS[0][1];for(const s of STEPS)if(p>=s[0])m=s[1];document.getElementById('message').textContent=m;}
const fxStop=(function(){const c=document.getElementById('fx'),g=c.getContext('2d');if(!g)return()=>{};const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;let W=0,H=0,R=1,run=true,stars=[],motes=[],shoot=null,last=performance.now(),nextShoot=1.2;
 function size(){R=Math.min(2,devicePixelRatio||1);W=c.clientWidth;H=c.clientHeight;c.width=W*R;c.height=H*R;g.setTransform(R,0,0,R,0,0);stars=Array.from({length:Math.round(W*H/5200)},()=>({x:Math.random()*W,y:Math.random()*H*.62,r:Math.random()*1.3+.3,t:Math.random()*6,s:Math.random()*2+.8}));}
 function mote(){const a=Math.random()*Math.PI*2,d=Math.random()*W*.32;return{x:W/2+Math.cos(a)*d,y:H*.66+Math.sin(a)*d*.25,vy:-(Math.random()*28+14),vx:(Math.random()-.5)*10,life:0,max:Math.random()*2.6+1.6,r:Math.random()*1.8+.8,gold:Math.random()<.65};}
 size();addEventListener('resize',size);for(let i=0;i<34;i++){const m=mote();m.life=Math.random()*m.max;motes.push(m);}
 function star4(x,y,r,a){g.globalAlpha=a;g.beginPath();g.moveTo(x,y-r*2.6);g.quadraticCurveTo(x,y,x+r*2.6,y);g.quadraticCurveTo(x,y,x,y+r*2.6);g.quadraticCurveTo(x,y,x-r*2.6,y);g.quadraticCurveTo(x,y,x,y-r*2.6);g.fill();}
 function frame(now){if(!run)return;const dt=Math.min(.05,(now-last)/1000);last=now;g.clearRect(0,0,W,H);g.globalCompositeOperation='lighter';
  g.fillStyle='#fff';for(const s of stars){s.t+=dt*s.s;const a=.35+.65*Math.abs(Math.sin(s.t));if(s.r>1.35)star4(s.x,s.y,s.r*.7,a);else{g.globalAlpha=a;g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill();}}
  for(let i=0;i<motes.length;i++){const m=motes[i];m.life+=dt;m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.life>=m.max){motes[i]=mote();continue;}const k=m.life/m.max,a=Math.sin(k*Math.PI);g.fillStyle=m.gold?'#ffe3a0':'#9fe8de';g.shadowColor=g.fillStyle;g.shadowBlur=8;star4(m.x,m.y,m.r*.8,a*.95);}
  g.shadowBlur=0;nextShoot-=dt;if(!shoot&&nextShoot<=0){shoot={x:W*(.35+Math.random()*.6),y:H*(.04+Math.random()*.2),vx:-(W*.9+Math.random()*W*.4),vy:W*.42,life:0};nextShoot=2.6+Math.random()*3;}
  if(shoot){shoot.life+=dt;shoot.x+=shoot.vx*dt;shoot.y+=shoot.vy*dt;const a=Math.max(0,1-shoot.life/.9),L=.12,gr=g.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*L,shoot.y-shoot.vy*L);gr.addColorStop(0,'rgba(255,248,226,'+a+')');gr.addColorStop(1,'rgba(159,232,222,0)');g.globalAlpha=1;g.strokeStyle=gr;g.lineWidth=2;g.lineCap='round';g.beginPath();g.moveTo(shoot.x,shoot.y);g.lineTo(shoot.x-shoot.vx*L,shoot.y-shoot.vy*L);g.stroke();g.fillStyle='#fff';star4(shoot.x,shoot.y,1.4,a);if(shoot.life>.9)shoot=null;}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';if(!calm)requestAnimationFrame(frame);}
 requestAnimationFrame(frame);return()=>{run=false;removeEventListener('resize',size);};})();
function loadDone(){loadProgress(1);clearInterval(tipT);LOAD.classList.add('done');setTimeout(()=>{LOAD.style.display='none';fxStop();},720);}
function failed(){document.getElementById('failure').style.display='flex';document.getElementById('loading').style.display='none';try{fxStop();clearInterval(tipT);}catch(e){}}
const buildUrl='Build';
const config={dataUrl:buildUrl+'/e29660d4d5741d4a794b5b1f109eb669.data.unityweb',frameworkUrl:buildUrl+'/ba25e9cd104dda0271cf1b74d82c5d52.framework.js.unityweb',codeUrl:buildUrl+'/fa5f7192d173f626f32cfcd9aa797b5a.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'NineToSixLab',productName:'루미 서바이벌',productVersion:'0.114.0',errorHandler:(msg)=>{try{localStorage.setItem('lumiErr',new Date().toISOString()+' '+String(msg).slice(0,300));}catch(e){}if(/abort|RuntimeError|memory|unreachable|out of bounds/i.test(String(msg)))failed();return true;},devicePixelRatio:Math.max(1,Math.min(window.devicePixelRatio||1,3,Math.sqrt(3600000/Math.max(1,canvas.clientWidth*canvas.clientHeight)))) /* 71차: 화면 배율 최대 2→3 · 360만 화소 */,showBanner:(message,type)=>{if(type==='error')failed();}};
const script=document.createElement('script');script.src=buildUrl+'/976461d38349a979214e3c559c2a1385.loader.js';script.onerror=failed;
script.onload=()=>createUnityInstance(canvas,config,loadProgress).then(game=>{window.lumiGame=game;loadDone();canvas.focus();lumiDiag(game);}).catch(failed);
document.body.appendChild(script);canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();try{localStorage.setItem('lumiErr',new Date().toISOString()+' 그래픽 연결 끊김');}catch(x){}failed();});
</script></body></html>
