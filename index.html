<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101B25">
<title>루미 서바이벌 · 시험판 51차</title>
<style>
@font-face{font-family:Jua;src:url('TemplateData/Jua-Regular.ttf')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0C151D;color:#fff6e8;font-family:Jua,'Malgun Gothic',sans-serif;touch-action:none}body{background:radial-gradient(ellipse at 50% 30%,#234653,#0C151D 70%)}#frame{position:relative;margin:auto;width:min(100vw,56.25vh);height:100%;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:#152530;box-shadow:0 0 90px #0f0a1c88}canvas{width:100%;height:100%;display:block;outline:none}#loading,#failure{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:35px;text-align:center;background:linear-gradient(180deg,#120f3066,#120f3000 35%,#0c0a2299 75%),url('TemplateData/bg_loading.jpg') center/cover,#120F30}h1,.eyebrow,.message,.tip{text-shadow:0 2px 6px #0b0820,0 0 2px #0b0820}.eyebrow{font-size:16px;color:#f4d697;letter-spacing:2px}h1{font-size:clamp(30px,6vw,48px);font-weight:400;margin:14px 0 20px}#hero{width:190px;height:210px;object-fit:contain;animation:bob 2.8s ease-in-out infinite}.track{width:85%;height:9px;border-radius:10px;background:#1b1628;margin:30px 0 14px;overflow:hidden}#fill{height:100%;width:0;background:linear-gradient(90deg,#70D9CC,#f4d697);transition:width .2s}.message{font-size:18px;line-height:1.6;color:#d0bfdc}.tip{font-size:14px;line-height:1.8;color:#ad9ebc;margin-top:32px}button{font:22px Jua;border:0;border-radius:20px;padding:16px 32px;background:#248B86;color:#fff6e8;margin-top:22px}#failure{display:none}footer{position:absolute;bottom:20px;color:#b5a6c4;font-size:12px}@keyframes bob{50%{transform:translateY(-9px) rotate(2deg)}}@media(max-aspect-ratio:3/4){#frame{width:100vw}}@media(prefers-reduced-motion:reduce){#hero{animation:none}}
</style></head><body>
<main id="frame"><canvas id="unity-canvas" tabindex="0" aria-label="루미 서바이벌 게임"></canvas>
<section id="loading" aria-live="polite"><div class="eyebrow">선택하고, 돌파하고, 생존하라</div><h1>루미 서바이벌</h1><img id="hero" src="TemplateData/lumi.png" alt="견습 마법사 루미"><div class="track"><div id="fill"></div></div><div class="message" id="message">마법책을 펴는 중… 0%</div><div class="tip">몬스터 떼를 한가운데로 모아<br>마법으로 한 번에 쓸어버리세요!</div><footer>시험판 51차 · 첫 실행은 조금 더 걸릴 수 있어요</footer></section>
<section id="failure" role="alert"><h1>잠시 길을 잃었어요</h1><p class="message">게임을 불러오지 못했어요.<br>인터넷 연결을 확인한 뒤 다시 열어 주세요.</p><button onclick="location.reload()">다시 불러오기</button></section></main>
<script>
const VERSION='시험판 51차';
// 17차 진단: 하얀 화면(페이지가 내려감) 직전 상태를 기기에 남긴다. 주소에 ?debug=1 이면 화면 왼쪽 위에 실시간 표시.
function lumiDiag(game){
 let prev=null;try{prev=JSON.parse(localStorage.getItem('lumiDiag')||'null');}catch(e){}
 const box=document.createElement('div');box.style.cssText='position:fixed;left:6px;top:6px;z-index:99;font:12px/1.4 monospace;color:#fff;background:#000a;padding:4px 6px;border-radius:6px;pointer-events:none;white-space:pre';
 const debug=/debug/.test(location.search);
 let err='';try{err=localStorage.getItem('lumiErr')||'';}catch(e){}
 if(prev&&!prev.clean){box.textContent='직전 판이 비정상 종료됨\n'+prev.text+(err?'\n오류 '+err:'')+'\n(이 화면을 캡처해 보내 주세요)';document.body.appendChild(box);setTimeout(()=>{if(!debug)box.remove();},12000);}
 else if(debug)document.body.appendChild(box);
 const t0=Date.now();let frames=0,fpsT0=performance.now();(function tick(){frames++;requestAnimationFrame(tick);})();
 function save(clean){try{const m=game.GetMetricsInfo?game.GetMetricsInfo():{};const sec=Math.round((Date.now()-t0)/1000);
  const now=performance.now(),fps=Math.round(frames*1000/Math.max(1,now-fpsT0));frames=0;fpsT0=now;
  const text=VERSION.replace('시험판 ','')+' '+Math.floor(sec/60)+'분'+(sec%60)+'초 · '+(document.hidden?'다른 앱으로 나감':'화면 보는 중')+' · WASM '+Math.round((m.totalWASMHeapSize||0)/1048576)+'MB(사용 '+Math.round((m.usedWASMHeapSize||0)/1048576)+') · '+fps+'fps · 화면 '+canvas.width+'x'+canvas.height;
  localStorage.setItem('lumiDiag',JSON.stringify({clean:clean,text:text}));if(debug&&box.isConnected)box.textContent=text;}catch(e){}}
 // 21차: Unity fps 값은 늘 0이라 직접 센다. 다른 앱으로 나가 있는 동안은 정상 종료로 기록한다
 // (아이폰이 뒤에 둔 탭을 메모리 때문에 내리면 돌아올 때 새로 열리는데, 21차까지는 이것도 비정상 종료로 보였다)
 save(document.hidden);setInterval(()=>save(document.hidden),2000);
 window.addEventListener('pagehide',()=>save(true));document.addEventListener('visibilitychange',()=>save(document.hidden));
}

const canvas=document.getElementById('unity-canvas');
function failed(){document.getElementById('failure').style.display='flex';document.getElementById('loading').style.display='none';}
const buildUrl='Build';
const config={dataUrl:buildUrl+'/f5498fbe14d3b934ea5cb1daba8c4b4c.data.unityweb',frameworkUrl:buildUrl+'/84e7adfa4d1f007a62c08cd99de194fb.framework.js.unityweb',codeUrl:buildUrl+'/873f2d717e8e8770bd4ae6135bf582e3.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'NineToSixLab',productName:'루미 서바이벌',productVersion:'0.51.0',errorHandler:(msg)=>{try{localStorage.setItem('lumiErr',new Date().toISOString()+' '+String(msg).slice(0,300));}catch(e){}if(/abort|RuntimeError|memory|unreachable|out of bounds/i.test(String(msg)))failed();return true;},devicePixelRatio:Math.max(1,Math.min(window.devicePixelRatio||1,2,Math.sqrt(2400000/Math.max(1,canvas.clientWidth*canvas.clientHeight)))),showBanner:(message,type)=>{if(type==='error')failed();}};
const script=document.createElement('script');script.src=buildUrl+'/97788aa213cc720ef192c40aa49d8a69.loader.js';script.onerror=failed;
script.onload=()=>createUnityInstance(canvas,config,p=>{document.getElementById('fill').style.width=(p*100)+'%';document.getElementById('message').textContent='마법을 준비하는 중… '+Math.round(p*100)+'%';}).then(game=>{window.lumiGame=game;document.getElementById('loading').style.display='none';canvas.focus();lumiDiag(game);}).catch(failed);
document.body.appendChild(script);canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();try{localStorage.setItem('lumiErr',new Date().toISOString()+' 그래픽 연결 끊김');}catch(x){}failed();});
</script></body></html>
